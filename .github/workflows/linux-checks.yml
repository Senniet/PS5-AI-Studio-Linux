name: Linux checks

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate application JavaScript
        run: npm run check
      - name: Validate Python helper syntax
        run: python3 -m py_compile apps/server/openpose_detect.py
      - name: Validate shell syntax
        run: bash -n scripts/*.sh
      - name: Check whitespace
        run: git diff --check